name: fitza
description: "Fitza - AI Fitness Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & Local Storage
  provider: ^6.1.2
  shared_preferences: ^2.2.3

  # UI, Icons & Styling
  google_fonts: ^6.2.0
  fl_chart: ^0.66.0

  # AI & Media
  image_picker: ^1.2.3
  google_generative_ai: ^0.4.0

  # Notifications & Local Sensors/Utilities
  flutter_local_notifications: ^17.1.2
  permission_handler: ^12.0.3
  pedometer: ^4.2.0

  google_sign_in: ^6.2.1
  geolocator: ^13.0.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  health: ^13.3.1
  flutter_animate: ^4.5.2
  confetti: ^0.8.0
  url_launcher: ^6.3.2
  country_picker: ^2.0.28
  audioplayers: ^6.8.1
  audio_session: ^0.2.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/
